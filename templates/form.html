{% extends "base.html" %} {% block content %}
<div class="card" style="max-width: 540px; margin: auto">
  <h2>{{ title }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %} {% if next %}<input
      type="hidden"
      name="next"
      value="{{ next }}"
    />{% endif %} {{ form.as_p }}<button class="btn">
      {{ button|default:"Save" }}
    </button>
  </form>
  {% endblock %}
</div>
